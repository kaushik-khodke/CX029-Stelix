<!DOCTYPE html>

    <meta name="description" content="MyHealthChain - Secure, encrypted health records with AI assistance" />
    <title>MyHealthChain - Your Health, Your Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Chrome Translate + React DOM Reconciliation Guard
      // Prevents React from throwing NotFoundError when Chrome Translate replaces text nodes with <font> tags.
      if (typeof Node === 'function' && Node.prototype) {
        const originalRemoveChild = Node.prototype.removeChild;
        Node.prototype.removeChild = function (child) {
          if (child && child.parentNode !== this) {
            if (window.console && console.warn) {
              console.warn('Chrome Translate DOM Guard: prevented removeChild Mismatch', child, this);
            }
            return child;
          }
          return originalRemoveChild.apply(this, arguments);
        };
        const originalInsertBefore = Node.prototype.insertBefore;
        Node.prototype.insertBefore = function (newNode, referenceNode) {
          if (referenceNode && referenceNode.parentNode !== this) {
            if (window.console && console.warn) {
              console.warn('Chrome Translate DOM Guard: prevented insertBefore Mismatch', newNode, referenceNode);
            }
            return newNode;
          }
          return originalInsertBefore.apply(this, arguments);
        };
      }
    </script>

    <!-- Google Translate Init Script (Strictly English 'en', Hindi 'hi', Marathi 'mr') -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,mr',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
