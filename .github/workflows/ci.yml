name: Stelix Continuous Integration (CI)

on:
  push:
    branches: [ main, oauth ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Pytest & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

  frontend-test:
    name: Frontend TypeScript Check & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Static Type Analysis
        run: |
          cd frontend
          npx tsc --noEmit
